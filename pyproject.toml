[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdp-mcp"
version = "0.1.0a1"
description = "MCP server wrapping the Composers' Desktop Project (CDP) for LLM-driven sound transformation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Dante Gil-Marin" }]
keywords = ["mcp", "cdp", "audio", "sound-design", "composers-desktop-project"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.0",
    "soundfile>=0.12",
    "numpy>=1.24",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "simpleeval>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "ruff>=0.5",
]

[project.scripts]
cdp-mcp = "cdp_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cdp_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Belt-and-suspenders against async-coordination bugs hanging the suite.
# Individual tests can tighten via @pytest.mark.timeout(<seconds>) or
# loosen with a larger value (the stress test in tests/test_stress.py
# uses @pytest.mark.timeout(300) since it intentionally runs ~60-180s).
timeout = 30
markers = [
    "slow: tests that take longer than 30 seconds and need real CDP (use `pytest -m slow`)",
    "timeout: per-test timeout in seconds (provided by pytest-timeout)",
]
# Default: exclude slow tests. Run them with `pytest -m slow` or
# `pytest -m ''` to run everything.
addopts = "-m 'not slow'"
